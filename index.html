<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor Táctico F11</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .pitch-lines {
      border: 2px solid rgba(255,255,255,0.4);
    }
    .pitch-center-circle {
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50%;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col select-none">

  <!-- OVERLAY Y SIDEBAR -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40 hidden"></div>
  <aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-slate-900 border-r border-slate-800 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col justify-between">
    <div class="p-4">
      <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-3">
        <h2 class="text-lg font-bold text-emerald-400">⚽ Panel Táctico</h2>
        <button id="btn-close-sidebar" class="text-slate-400 hover:text-white text-xl">✕</button>
      </div>
      <nav class="space-y-1 text-sm font-medium">
        <button id="nav-pizarra" class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-slate-800 flex items-center gap-2">⚽ Pizarra Táctica</button>
        <button id="nav-marcador" class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-slate-800 flex items-center gap-2">⏱️ Marcador</button>
        <button id="nav-tacticas" class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-slate-800 flex items-center gap-2">📐 Balón Parado</button>
        <button id="nav-enfrentamiento" class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-slate-800 flex items-center gap-2">⚔️ Enfrentamiento</button>
        <button id="nav-rivales" class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-slate-800 flex items-center gap-2">🛡️ Equipos Rivales</button>
        <button id="nav-plantilla" class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-slate-800 flex items-center gap-2">👥 Plantilla</button>
        <button id="nav-partidos" class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-slate-800 flex items-center gap-2">📅 Partidos</button>
      </nav>
    </div>
  </aside>

  <!-- ENCABEZADO -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between sticky top-0 z-30">
    <button id="btn-hamburger" class="p-2 bg-slate-800 rounded-lg text-slate-200 hover:text-white">☰</button>
    <h1 id="header-title" class="font-bold text-base md:text-lg text-emerald-400">⚽ Pizarra Táctica</h1>
    <div class="w-8"></div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 p-3 md:p-6 max-w-5xl w-full mx-auto">
    
    <!-- VISTA: PIZARRA -->
    <section id="sec-pizarra" class="space-y-4">
      <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-wrap gap-3 justify-between items-center text-xs">
        <div class="flex gap-2 items-center">
          <label>Formación:</label>
          <select id="select-formation" class="bg-slate-800 border border-slate-700 rounded p-1.5 text-white">
            <option value="4-3-3">4-3-3</option>
            <option value="4-4-2">4-4-2</option>
          </select>
        </div>
        <div class="flex gap-2 items-center">
          <label>Equipación:</label>
          <select id="select-kit" class="bg-slate-800 border border-slate-700 rounded p-1.5 text-white">
            <option value="local">Local (Azul)</option>
            <option value="visitante">Visitante (Rosa)</option>
          </select>
        </div>
        <button id="reset-btn" class="bg-red-900/40 hover:bg-red-800 text-red-200 border border-red-700 px-3 py-1.5 rounded-lg">Resetear</button>
      </div>

      <!-- CAMPO DE FÚTBOL -->
      <div id="pitch" class="relative w-full aspect-[2/3] max-h-[580px] bg-emerald-700 rounded-2xl overflow-hidden shadow-2xl border-4 border-emerald-800 mx-auto">
        <div class="absolute inset-0 bg-[linear-gradient(to_bottom,transparent_50%,rgba(0,0,0,0.1)_50%)] bg-[length:100%_10%]"></div>
        <div class="absolute inset-2 pitch-lines rounded-xl"></div>
        <div class="absolute top-1/2 left-0 w-full h-[2px] bg-white/40 -translate-y-1/2"></div>
        <div class="absolute top-1/2 left-1/2 w-28 h-28 pitch-center-circle -translate-x-1/2 -translate-y-1/2"></div>
      </div>

      <!-- BANQUILLO -->
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-sm">Banquillo (<span id="bench-count">0</span>)</h3>
          <button id="btn-add-bench-player" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg">+ Añadir Suplente</button>
        </div>
        <div id="bench-list" class="grid grid-cols-2 md:grid-cols-4 gap-2"></div>
      </div>
    </section>

    <!-- VISTA: MARCADOR -->
    <section id="sec-marcador" class="hidden space-y-4 text-center">
      <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 space-y-4">
        <h3 class="text-xl font-bold text-emerald-400">Marcador en Directo</h3>
        <div class="flex justify-center items-center gap-8 text-4xl font-black">
          <div><span id="score-local">0</span></div>
          <div class="text-slate-600">-</div>
          <div><span id="score-away">0</span></div>
        </div>
      </div>
    </section>

    <!-- VISTA: TÁCTICAS -->
    <section id="sec-tacticas" class="hidden space-y-4">
      <div id="tactics-pitch" class="relative w-full aspect-[4/3] bg-emerald-800 rounded-xl overflow-hidden border-2 border-emerald-600">
        <canvas id="tactics-canvas" class="absolute inset-0 w-full h-full"></canvas>
      </div>
    </section>

    <!-- VISTA: ENFRENTAMIENTO -->
    <section id="sec-enfrentamiento" class="hidden space-y-4">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
        <select id="select-rival-team" class="w-full bg-slate-800 p-2 rounded border border-slate-700 text-sm">
          <option value="">-- Seleccionar Rival --</option>
        </select>
      </div>
    </section>

    <!-- VISTA: RIVALES -->
    <section id="sec-rivales" class="hidden space-y-4">
      <form id="form-add-rival" class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex gap-2">
        <input id="rival-name" type="text" placeholder="Nombre del rival" class="flex-1 bg-slate-800 px-3 py-2 rounded text-sm border border-slate-700" required />
        <select id="rival-formation" class="bg-slate-800 px-3 py-2 rounded text-sm border border-slate-700">
          <option value="4-3-3">4-3-3</option>
          <option value="4-4-2">4-4-2</option>
        </select>
        <button type="submit" class="bg-emerald-600 text-white px-4 py-2 rounded text-sm font-semibold">Guardar</button>
      </form>
      <div id="rivals-list" class="space-y-2"></div>
    </section>

    <!-- VISTA: PLANTILLA -->
    <section id="sec-plantilla" class="hidden space-y-4">
      <form id="form-add-player" class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
        <input type="hidden" id="edit-player-id" />
        <div class="flex gap-2">
          <input id="player-num" type="number" placeholder="Nº" class="w-16 bg-slate-800 p-2 rounded border border-slate-700 text-sm" required />
          <input id="player-name" type="text" placeholder="Nombre del jugador" class="flex-1 bg-slate-800 p-2 rounded border border-slate-700 text-sm" required />
        </div>
        <div class="flex flex-wrap gap-2 text-xs">
          <label class="flex items-center gap-1"><input type="checkbox" name="pos" value="POR"> POR</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="pos" value="DFC"> DFC</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="pos" value="LD"> LD</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="pos" value="LI"> LI</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="pos" value="MC"> MC</label>
          <label class="flex items-center gap-1"><input type="checkbox" name="pos" value="DC"> DC</label>
        </div>
        <button type="submit" class="w-full bg-emerald-600 py-2 rounded font-semibold text-sm">Guardar Jugador</button>
      </form>
      <div id="squad-list" class="space-y-2"></div>
    </section>

    <!-- VISTA: PARTIDOS -->
    <section id="sec-partidos" class="hidden space-y-4">
      <div id="matches-list" class="space-y-2"></div>
    </section>

  </main>

  <!-- JAVASCRIPT GLOBAL Y ROBUSTO -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {

      function safeOn(id, event, callback) {
        const el = document.getElementById(id);
        if (el) el.addEventListener(event, callback);
      }

      // --- ESTADO INICIAL ---
      let squad = JSON.parse(localStorage.getItem('f11_squad')) || [
        { id: 1, num: 1, name: "Iker", roles: ["POR"] },
        { id: 2, num: 2, name: "Carvajal", roles: ["LD"] },
        { id: 3, num: 4, name: "Ramos", roles: ["DFC"] },
        { id: 4, num: 3, name: "Piqué", roles: ["DFC"] },
        { id: 5, num: 5, name: "Jordi Alba", roles: ["LI"] },
        { id: 6, num: 6, name: "Busquets", roles: ["MCD"] },
        { id: 7, num: 8, name: "Xavi", roles: ["MC"] },
        { id: 8, num: 10, name: "Iniesta", roles: ["MC"] },
        { id: 9, num: 7, name: "Villa", roles: ["DC"] },
        { id: 10, num: 9, name: "Torres", roles: ["DC"] },
        { id: 11, num: 11, name: "Pedro", roles: ["EI"] }
      ];

      let rivalTeams = JSON.parse(localStorage.getItem('f11_rivals')) || [];
      let savedMatches = JSON.parse(localStorage.getItem('f11_matches')) || [];

      const formations = {
        '4-3-3': [
          { slot: 1, role: 'POR', x: 50, y: 88 },
          { slot: 2, role: 'LD', x: 82, y: 72 },
          { slot: 3, role: 'DFC', x: 62, y: 78 },
          { slot: 4, role: 'DFC', x: 38, y: 78 },
          { slot: 5, role: 'LI', x: 18, y: 72 },
          { slot: 6, role: 'MCD', x: 50, y: 62 },
          { slot: 7, role: 'MC', x: 68, y: 48 },
          { slot: 8, role: 'MC', x: 32, y: 48 },
          { slot: 9, role: 'ED', x: 80, y: 26 },
          { slot: 10, role: 'DC', x: 50, y: 18 },
          { slot: 11, role: 'EI', x: 20, y: 26 }
        ],
        '4-4-2': [
          { slot: 1, role: 'POR', x: 50, y: 88 },
          { slot: 2, role: 'LD', x: 82, y: 72 },
          { slot: 3, role: 'DFC', x: 62, y: 78 },
          { slot: 4, role: 'DFC', x: 38, y: 78 },
          { slot: 5, role: 'LI', x: 18, y: 72 },
          { slot: 6, role: 'MC', x: 62, y: 52 },
          { slot: 7, role: 'MC', x: 38, y: 52 },
          { slot: 8, role: 'ED', x: 85, y: 40 },
          { slot: 9, role: 'EI', x: 15, y: 40 },
          { slot: 10, role: 'DC', x: 60, y: 20 },
          { slot: 11, role: 'DC', x: 40, y: 20 }
        ]
      };

      let currentFormationKey = localStorage.getItem('f11_formation') || '4-3-3';
      let currentKit = localStorage.getItem('f11_kit') || 'local';
      let activeTokens = JSON.parse(localStorage.getItem('f11_active_tokens')) || null;
      let activeBench = JSON.parse(localStorage.getItem('f11_active_bench')) || [];

      // --- MENU NAVEGACION ---
      function toggleSidebar(open) {
        const sb = document.getElementById('sidebar');
        const sbo = document.getElementById('sidebar-overlay');
        if (sb && sbo) {
          if (open) {
            sb.classList.remove('-translate-x-full');
            sbo.classList.remove('hidden');
          } else {
            sb.classList.add('-translate-x-full');
            sbo.classList.add('hidden');
          }
        }
      }

      function switchView(view) {
        ['pizarra', 'marcador', 'tacticas', 'enfrentamiento', 'rivales', 'plantilla', 'partidos'].forEach(v => {
          const el = document.getElementById(`sec-${v}`);
          if (el) el.classList.add('hidden');
        });

        const activeSec = document.getElementById(`sec-${view}`);
        if (activeSec) activeSec.classList.remove('hidden');

        const titles = {
          pizarra: '⚽ Pizarra Táctica',
          marcador: '⏱️ Marcador en Directo',
          tacticas: '📐 Balón Parado',
          enfrentamiento: '⚔️ Enfrentamiento',
          rivales: '🛡️ Equipos Rivales',
          plantilla: '👥 Plantilla',
          partidos: '📅 Partidos Guardados'
        };

        const titleEl = document.getElementById('header-title');
        if (titleEl) titleEl.innerText = titles[view] || 'Gestor Táctico';

        toggleSidebar(false);

        if (view === 'pizarra') renderPitch();
        if (view === 'rivales') renderRivalsList();
        if (view === 'plantilla') renderSquadList();
        if (view === 'partidos') renderMatchesList();
        if (view === 'enfrentamiento') initMatchupView();
      }

      safeOn('btn-hamburger', 'click', () => toggleSidebar(true));
      safeOn('btn-close-sidebar', 'click', () => toggleSidebar(false));
      safeOn('sidebar-overlay', 'click', () => toggleSidebar(false));

      ['pizarra', 'marcador', 'tacticas', 'enfrentamiento', 'rivales', 'plantilla', 'partidos'].forEach(v => {
        safeOn(`nav-${v}`, 'click', () => switchView(v));
      });

      // --- PIZARRA ---
      function syncTokensWithFormation(forceReset = false) {
        const template = formations[currentFormationKey] || formations['4-3-3'];
        if (forceReset || !activeTokens) {
          activeTokens = template.map((pos, idx) => {
            const p = squad[idx] || { num: idx + 1, name: `J${idx + 1}` };
            return { id: Date.now() + idx, slot: pos.slot, role: pos.role, x: pos.x, y: pos.y, num: p.num, name: p.name };
          });
        }
        savePitchState();
      }

      function savePitchState() {
        localStorage.setItem('f11_formation', currentFormationKey);
        localStorage.setItem('f11_kit', currentKit);
        localStorage.setItem('f11_active_tokens', JSON.stringify(activeTokens));
        localStorage.setItem('f11_active_bench', JSON.stringify(activeBench));
      }

      function renderPitch() {
        const pitch = document.getElementById('pitch');
        if (!pitch) return;
        pitch.querySelectorAll('.player-token').forEach(t => t.remove());

        activeTokens.forEach(token => {
          const el = document.createElement('div');
          el.className = `player-token absolute rounded-full shadow-lg flex flex-col items-center justify-center cursor-pointer text-white border-2 border-white ${currentKit === 'local' ? 'bg-blue-600' : 'bg-pink-600'}`;
          el.style.width = '36px';
          el.style.height = '36px';
          el.style.left = `calc(${token.x}% - 18px)`;
          el.style.top = `calc(${token.y}% - 18px)`;
          el.innerHTML = `<span class="text-xs font-black leading-none">${token.num}</span><span class="text-[8px] font-bold truncate max-w-[32px]">${token.name}</span>`;

          makeDraggable(el, pitch, (nx, ny) => { token.x = nx; token.y = ny; savePitchState(); });
          pitch.appendChild(el);
        });
        renderBench();
      }

      function renderBench() {
        const benchList = document.getElementById('bench-list');
        const benchCount = document.getElementById('bench-count');
        if (!benchList) return;
        benchList.innerHTML = '';
        if (benchCount) benchCount.innerText = activeBench.length;

        activeBench.forEach((p, idx) => {
          const card = document.createElement('div');
          card.className = "bg-slate-800 p-2 rounded-lg flex justify-between items-center text-xs border border-slate-700";
          card.innerHTML = `<div><span class="font-bold text-emerald-400">#${p.num}</span> <span>${p.name}</span></div><button class="text-slate-400 hover:text-red-400">✕</button>`;
          card.querySelector('button').onclick = () => { activeBench.splice(idx, 1); renderBench(); savePitchState(); };
          benchList.appendChild(card);
        });
      }

      safeOn('btn-add-bench-player', 'click', () => {
        activeBench.push({ num: activeBench.length + 12, name: `Suplente ${activeBench.length + 1}` });
        renderBench();
        savePitchState();
      });

      safeOn('select-formation', 'change', (e) => {
        currentFormationKey = e.target.value;
        syncTokensWithFormation(true);
        renderPitch();
      });

      safeOn('select-kit', 'change', (e) => {
        currentKit = e.target.value;
        savePitchState();
        renderPitch();
      });

      safeOn('reset-btn', 'click', () => {
        if (confirm('¿Resetear alineación?')) {
          syncTokensWithFormation(true);
          activeBench = [];
          renderPitch();
        }
      });

      // --- DRAG AND DROP ---
      function makeDraggable(element, container, onMoveEnd) {
        let active = false;

        const start = (e) => {
          active = true;
          document.addEventListener('mousemove', move);
          document.addEventListener('touchmove', move, { passive: false });
          document.addEventListener('mouseup', stop);
          document.addEventListener('touchend', stop);
        };

        const move = (e) => {
          if (!active) return;
          if (e.cancelable) e.preventDefault();
          const ev = e.touches ? e.touches[0] : e;
          const rect = container.getBoundingClientRect();
          let posX = ((ev.clientX - rect.left) / rect.width) * 100;
          let posY = ((ev.clientY - rect.top) / rect.height) * 100;
          posX = Math.max(4, Math.min(96, posX));
          posY = Math.max(4, Math.min(96, posY));
          element.style.left = `calc(${posX}% - 18px)`;
          element.style.top = `calc(${posY}% - 18px)`;
          if (onMoveEnd) onMoveEnd(posX, posY);
        };

        const stop = () => {
          active = false;
          document.removeEventListener('mousemove', move);
          document.removeEventListener('touchmove', move);
          document.removeEventListener('mouseup', stop);
          document.removeEventListener('touchend', stop);
        };

        element.addEventListener('mousedown', start);
        element.addEventListener('touchstart', start, { passive: false });
      }

      // --- PLANTILLA ---
      function renderSquadList() {
        const container = document.getElementById('squad-list');
        if (!container) return;
        container.innerHTML = '';
        squad.forEach(p => {
          const div = document.createElement('div');
          div.className = "bg-slate-900 p-2.5 rounded-lg border border-slate-800 flex justify-between items-center text-xs";
          div.innerHTML = `
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center">${p.num}</span>
              <span class="font-bold">${p.name}</span>
            </div>
            <button class="text-slate-500 hover:text-red-400">🗑️</button>
          `;
          div.querySelector('button').onclick = () => {
            squad = squad.filter(x => x.id !== p.id);
            localStorage.setItem('f11_squad', JSON.stringify(squad));
            renderSquadList();
          };
          container.appendChild(div);
        });
      }

      safeOn('form-add-player', 'submit', (e) => {
        e.preventDefault();
        const num = parseInt(document.getElementById('player-num').value);
        const name = document.getElementById('player-name').value.trim();
        if (name && !isNaN(num)) {
          squad.push({ id: Date.now(), num, name, roles: [] });
          localStorage.setItem('f11_squad', JSON.stringify(squad));
          document.getElementById('form-add-player').reset();
          renderSquadList();
        }
      });

      // --- RIVALES ---
      function renderRivalsList() {
        const container = document.getElementById('rivals-list');
        if (!container) return;
        container.innerHTML = rivalTeams.length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">Sin rivales.</p>' : '';
        rivalTeams.forEach(r => {
          const div = document.createElement('div');
          div.className = "bg-slate-900 p-3 rounded-lg border border-slate-800 flex justify-between items-center text-xs";
          div.innerHTML = `<span class="font-bold">${r.name} (${r.formation})</span><button class="text-slate-500 hover:text-red-400">🗑️</button>`;
          div.querySelector('button').onclick = () => {
            rivalTeams = rivalTeams.filter(x => x.id !== r.id);
            localStorage.setItem('f11_rivals', JSON.stringify(rivalTeams));
            renderRivalsList();
          };
          container.appendChild(div);
        });
      }

      safeOn('form-add-rival', 'submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('rival-name').value.trim();
        const formation = document.getElementById('rival-formation').value;
        if (name) {
          rivalTeams.push({ id: Date.now(), name, formation });
          localStorage.setItem('f11_rivals', JSON.stringify(rivalTeams));
          document.getElementById('form-add-rival').reset();
          renderRivalsList();
        }
      });

      function initMatchupView() {
        const sel = document.getElementById('select-rival-team');
        if (!sel) return;
        sel.innerHTML = '<option value="">-- Seleccionar Rival --</option>';
        rivalTeams.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r.id;
          opt.innerText = r.name;
          sel.appendChild(opt);
        });
      }

      function renderMatchesList() {
        const container = document.getElementById('matches-list');
        if (container) container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Sin partidos guardados.</p>';
      }

      // --- INICIALIZACIÓN ---
      syncTokensWithFormation(false);
      renderPitch();
    });
  </script>
</body>
</html>
