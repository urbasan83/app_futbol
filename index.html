<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pizarra Táctica F11</title>
  
  <!-- Configuración PWA y Móvil -->
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body, html {
      user-select: none;
      -webkit-user-select: none;
    }
    .touch-none-pitch {
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-white h-screen w-screen flex flex-col font-sans select-none overflow-hidden">

  <!-- Cabecera -->
  <header class="p-3 bg-slate-800 border-b border-slate-700 flex justify-between items-center z-10 shadow-md">
    <div class="flex items-center gap-3">
      <button id="btn-hamburger" class="text-white hover:text-emerald-400 focus:outline-none p-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <h1 id="header-title" class="text-base font-bold text-emerald-400 flex items-center gap-2">
        ⚽ Pizarra Táctica
      </h1>
    </div>
    <div id="header-actions" class="flex gap-2">
      <button id="btn-save-lineup-modal" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-2.5 py-1.5 rounded-lg font-semibold flex items-center gap-1 transition active:scale-95 shadow">
        💾 <span class="hidden sm:inline">Guardar</span>
      </button>
      <button id="reset-btn" class="bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1.5 rounded-lg font-semibold transition active:scale-95 border border-slate-600">
        Resetear
      </button>
    </div>
  </header>

  <!-- Menú Lateral Hamburguesa -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40 hidden transition-opacity"></div>
  <aside id="sidebar" class="fixed top-0 left-0 w-64 h-full bg-slate-800 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl flex flex-col">
    <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900">
      <h2 class="font-bold text-lg text-emerald-400">Gestor F11</h2>
      <button id="btn-close-sidebar" class="text-slate-400 hover:text-white">✕</button>
    </div>
    <nav class="flex-1 p-3 space-y-2">
      <button id="nav-pizarra" class="w-full text-left px-4 py-3 rounded-xl bg-slate-700 text-white font-medium flex items-center gap-3 transition">
        📋 Pizarra Táctica
      </button>
      <button id="nav-plantilla" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-700/50 text-slate-300 font-medium flex items-center gap-3 transition">
        👥 Plantilla del Equipo
      </button>
      <button id="nav-partidos" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-700/50 text-slate-300 font-medium flex items-center gap-3 transition">
        📅 Partidos Guardados
      </button>
    </nav>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 relative overflow-hidden flex flex-col">

    <!-- SECCIÓN 1: PIZARRA TÁCTICA -->
    <section id="sec-pizarra" class="flex-1 flex flex-col h-full overflow-hidden p-2">
      <!-- Selector de Formación y Equipación -->
      <div class="flex justify-between items-center gap-2 mb-2 bg-slate-800 p-2 rounded-xl border border-slate-700">
        <div class="flex items-center gap-1">
          <label class="text-xs text-slate-400 font-medium">Sistema:</label>
          <select id="select-formation" class="bg-slate-900 border border-slate-600 text-white text-xs rounded-lg p-1.5 focus:ring-emerald-500">
            <option value="4-3-3">4-3-3</option>
            <option value="4-4-2">4-4-2</option>
          </select>
        </div>

        <div class="flex items-center gap-1">
          <label class="text-xs text-slate-400 font-medium">Equipación:</label>
          <select id="select-kit" class="bg-slate-900 border border-slate-600 text-white text-xs rounded-lg p-1.5 focus:ring-emerald-500">
            <option value="local">🔵 Local</option>
            <option value="visitante">🩷 Visitante</option>
          </select>
        </div>
      </div>

      <!-- Campo de Fútbol -->
      <div class="flex-1 relative flex items-center justify-center overflow-hidden">
        <div id="pitch" class="touch-none-pitch relative w-full h-full max-w-md bg-emerald-700 rounded-2xl border-4 border-white/90 shadow-2xl overflow-hidden">
          <svg class="absolute inset-0 w-full h-full pointer-events-none stroke-white/80 fill-none" stroke-width="2.5">
            <line x1="0" y1="50%" x2="100%" y2="50%" />
            <circle cx="50%" cy="50%" r="15%" />
            <circle cx="50%" cy="50%" r="2" fill="white" />
            
            <rect x="20%" y="0" width="60%" height="16%" />
            <rect x="35%" y="0" width="30%" height="6%" />
            <circle cx="50%" cy="11%" r="2" fill="white" />

            <rect x="20%" y="84%" width="60%" height="16%" />
            <rect x="35%" y="94%" width="30%" height="6%" />
            <circle cx="50%" cy="89%" r="2" fill="white" />
          </svg>
        </div>
      </div>
    </section>

    <!-- SECCIÓN 2: PLANTILLA -->
    <section id="sec-plantilla" class="flex-1 hidden h-full overflow-y-auto p-4 max-w-lg mx-auto w-full">
      <!-- Formulario Crear/Editar Jugador -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6 shadow-lg">
        <h3 id="player-form-title" class="text-sm font-bold text-emerald-400 mb-3 uppercase tracking-wider">Añadir Nuevo Jugador</h3>
        <form id="form-add-player" class="space-y-3">
          <input type="hidden" id="edit-player-id" value="">
          <div class="flex gap-2">
            <input type="number" id="player-num" min="1" max="99" placeholder="Nº" required class="w-20 bg-slate-900 border border-slate-600 rounded-lg p-2 text-center text-white text-sm focus:border-emerald-500 focus:outline-none">
            <input type="text" id="player-name" placeholder="Nombre del Jugador" required class="flex-1 bg-slate-900 border border-slate-600 rounded-lg p-2 text-white text-sm focus:border-emerald-500 focus:outline-none">
          </div>
          
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Posiciones habituales (Marca todas las que apliquen):</label>
            <div class="grid grid-cols-3 gap-1.5 text-xs">
              <label class="flex items-center gap-1.5 bg-slate-900 p-2 rounded-lg border border-slate-700 cursor-pointer">
                <input type="checkbox" name="pos" value="POR" class="accent-emerald-500"> Portero
              </label>
              <label class="flex items-center gap-1.5 bg-slate-900 p-2 rounded-lg border border-slate-700 cursor-pointer">
                <input type="checkbox" name="pos" value="DFC" class="accent-emerald-500"> Def. Central
              </label>
              <label class="flex items-center gap-1.5 bg-slate-900 p-2 rounded-lg border border-slate-700 cursor-pointer">
                <input type="checkbox" name="pos" value="LD" class="accent-emerald-500"> Lat. Derecho
              </label>
              <label class="flex items-center gap-1.5 bg-slate-900 p-2 rounded-lg border border-slate-700 cursor-pointer">
                <input type="checkbox" name="pos" value="LI" class="accent-emerald-500"> Lat. Izquierdo
              </label>
              <label class="flex items-center gap-1.5 bg-slate-900 p-2 rounded-lg border border-slate-700 cursor-pointer">
                <input type="checkbox" name="pos" value="MCD" class="accent-emerald-500"> Mediocentro
              </label>
              <label class="flex items-center gap-1.5 bg-slate-900 p-2 rounded-lg border border-slate-700 cursor-pointer">
                <input type="checkbox" name="pos" value="MC" class="accent-emerald-500"> Interior
              </label>
              <label class="flex items-center gap-1.5 bg-slate-900 p-2 rounded-lg border border-slate-700 cursor-pointer">
                <input type="checkbox" name="pos" value="ED" class="accent-emerald-500"> Ext. Derecho
              </label>
              <label class="flex items-center gap-1.5 bg-slate-900 p-2 rounded-lg border border-slate-700 cursor-pointer">
                <input type="checkbox" name="pos" value="EI" class="accent-emerald-500"> Ext. Izquierdo
              </label>
              <label class="flex items-center gap-1.5 bg-slate-900 p-2 rounded-lg border border-slate-700 cursor-pointer">
                <input type="checkbox" name="pos" value="DC" class="accent-emerald-500"> Delantero
              </label>
            </div>
          </div>

          <div class="flex gap-2 pt-1">
            <button type="submit" id="btn-save-player" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-sm transition">
              Guardar Jugador
            </button>
            <button type="button" id="btn-cancel-edit" class="hidden bg-slate-600 hover:bg-slate-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition">
              Cancelar
            </button>
          </div>
        </form>
      </div>

      <!-- Lista de Jugadores (Ordenados por Número) -->
      <div class="space-y-2">
        <div class="flex justify-between items-center mb-2">
          <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider">Jugadores en Plantilla</h3>
          <span class="text-xs text-slate-400">Ordenados por Dorsal</span>
        </div>
        <div id="squad-list" class="space-y-2 pb-12">
          <!-- Renderizado dinámico -->
        </div>
      </div>
    </section>

    <!-- SECCIÓN 3: PARTIDOS GUARDADOS -->
    <section id="sec-partidos" class="flex-1 hidden h-full overflow-y-auto p-4 max-w-lg mx-auto w-full">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-sm font-bold text-emerald-400 uppercase tracking-wider">Alineaciones Guardadas</h3>
      </div>
      <div id="matches-list" class="space-y-3 pb-12">
        <!-- Renderizado dinámico -->
      </div>
    </section>

  </main>

  <!-- MODAL: ASIGNAR JUGADOR A FICHA -->
  <div id="modal-select-player" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 rounded-2xl border border-slate-700 max-w-sm w-full p-4 shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-3">
        <h3 class="font-bold text-emerald-400 text-sm" id="modal-title">Seleccionar Jugador</h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <p class="text-xs text-slate-400 mb-2">Mostrando sugeridos para la posición actual:</p>
      <div id="modal-player-list" class="flex-1 overflow-y-auto space-y-2 my-2">
        <!-- Opciones de jugadores -->
      </div>
    </div>
  </div>

  <!-- MODAL: GUARDAR ALINEACIÓN -->
  <div id="modal-save-lineup" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 rounded-2xl border border-slate-700 max-w-sm w-full p-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-3">
        <h3 class="font-bold text-emerald-400 text-sm">Guardar Alineación / Partido</h3>
        <button id="btn-close-save-modal" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <form id="form-save-match" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Nombre de la Alineación</label>
          <input type="text" id="match-name" placeholder="Ej: Jornada 1 - Alineación Titular" required class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-white text-sm focus:border-emerald-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Fecha del Partido</label>
          <input type="date" id="match-date" required class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-white text-sm focus:border-emerald-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Equipo Rival</label>
          <input type="text" id="match-rival" placeholder="Ej: Rayo Vallecano" required class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-white text-sm focus:border-emerald-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-sm transition mt-2">
          Guardar en Partidos
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL: EDITAR DATOS DE PARTIDO -->
  <div id="modal-edit-match" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 rounded-2xl border border-slate-700 max-w-sm w-full p-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-3">
        <h3 class="font-bold text-emerald-400 text-sm">Editar Información del Partido</h3>
        <button id="btn-close-edit-match-modal" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <form id="form-edit-match" class="space-y-3">
        <input type="hidden" id="edit-match-id">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Nombre de la Alineación</label>
          <input type="text" id="edit-match-name" required class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-white text-sm focus:border-emerald-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Fecha del Partido</label>
          <input type="date" id="edit-match-date" required class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-white text-sm focus:border-emerald-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Equipo Rival</label>
          <input type="text" id="edit-match-rival" required class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-white text-sm focus:border-emerald-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-sm transition mt-2">
          Actualizar Partido
        </button>
      </form>
    </div>
  </div>

  <script>
    // --- ESTADO GLOBAL ---
    let squad = JSON.parse(localStorage.getItem('f11_squad')) || [
      { id: 1, num: 1, name: "Iker", roles: ["POR"] },
      { id: 2, num: 2, name: "Carvajal", roles: ["LD"] },
      { id: 3, num: 4, name: "Ramos", roles: ["DFC"] },
      { id: 4, num: 3, name: "Piqué", roles: ["DFC"] },
      { id: 5, num: 5, name: "Jordi Alba", roles: ["LI"] },
      { id: 6, num: 6, name: "Busquets", roles: ["MCD"] },
      { id: 7, num: 8, name: "Xavi", roles: ["MC"] },
      { id: 8, num: 10, name: "Iniesta", roles: ["MC", "EI"] },
      { id: 9, num: 7, name: "Villa", roles: ["ED", "DC"] },
      { id: 10, num: 9, name: "Torres", roles: ["DC"] },
      { id: 11, num: 11, name: "Pedro", roles: ["EI", "ED"] }
    ];

    let savedMatches = JSON.parse(localStorage.getItem('f11_matches')) || [];

    const formations = {
      '4-3-3': [
        { slot: 1,  role: 'POR', x: 50, y: 92 },
        { slot: 2,  role: 'LD',  x: 85, y: 76 },
        { slot: 3,  role: 'DFC', x: 63, y: 82 },
        { slot: 4,  role: 'DFC', x: 37, y: 82 },
        { slot: 5,  role: 'LI',  x: 15, y: 76 },
        { slot: 6,  role: 'MCD', x: 50, y: 66 },
        { slot: 7,  role: 'MC',  x: 70, y: 54 },
        { slot: 8,  role: 'MC',  x: 30, y: 54 },
        { slot: 9,  role: 'ED',  x: 82, y: 34 },
        { slot: 10, role: 'DC',  x: 50, y: 26 },
        { slot: 11, role: 'EI',  x: 18, y: 34 }
      ],
      '4-4-2': [
        { slot: 1,  role: 'POR', x: 50, y: 92 },
        { slot: 2,  role: 'LD',  x: 85, y: 78 },
        { slot: 3,  role: 'DFC', x: 63, y: 82 },
        { slot: 4,  role: 'DFC', x: 37, y: 82 },
        { slot: 5,  role: 'LI',  x: 15, y: 78 },
        { slot: 6,  role: 'MC',  x: 62, y: 58 },
        { slot: 7,  role: 'MC',  x: 38, y: 58 },
        { slot: 8,  role: 'ED',  x: 85, y: 45 },
        { slot: 9,  role: 'EI',  x: 15, y: 45 },
        { slot: 10, role: 'DC',  x: 62, y: 26 },
        { slot: 11, role: 'DC',  x: 38, y: 26 }
      ]
    };

    let currentFormationKey = localStorage.getItem('f11_formation') || '4-3-3';
    let currentKit = localStorage.getItem('f11_kit') || 'local';
    let activeTokens = JSON.parse(localStorage.getItem('f11_active_tokens')) || null;
    let selectedSlotId = null;

    // Elementos DOM
    const pitch = document.getElementById('pitch');
    const selectFormation = document.getElementById('select-formation');
    const selectKit = document.getElementById('select-kit');
    const resetBtn = document.getElementById('reset-btn');
    const squadList = document.getElementById('squad-list');
    const matchesList = document.getElementById('matches-list');

    // Menú Lateral
    const btnHamburger = document.getElementById('btn-hamburger');
    const btnCloseSidebar = document.getElementById('btn-close-sidebar');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const navPizarra = document.getElementById('nav-pizarra');
    const navPlantilla = document.getElementById('nav-plantilla');
    const navPartidos = document.getElementById('nav-partidos');
    const secPizarra = document.getElementById('sec-pizarra');
    const secPlantilla = document.getElementById('sec-plantilla');
    const secPartidos = document.getElementById('sec-partidos');
    const headerTitle = document.getElementById('header-title');
    const headerActions = document.getElementById('header-actions');

    // Modales
    const modalSelectPlayer = document.getElementById('modal-select-player');
    const modalSaveLineup = document.getElementById('modal-save-lineup');
    const modalEditMatch = document.getElementById('modal-edit-match');
    const btnSaveLineupModal = document.getElementById('btn-save-lineup-modal');

    // --- ORDENAR PLANTILLA POR NÚMERO ---
    function sortSquad() {
      squad.sort((a, b) => parseInt(a.num) - parseInt(b.num));
    }

    // --- GESTIÓN DE NAVEGACIÓN ---
    function toggleSidebar(open) {
      if (open) {
        sidebar.classList.remove('-translate-x-full');
        sidebarOverlay.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        sidebarOverlay.classList.add('hidden');
      }
    }

    function switchView(view) {
      secPizarra.classList.add('hidden');
      secPlantilla.classList.add('hidden');
      secPartidos.classList.add('hidden');

      navPizarra.className = "w-full text-left px-4 py-3 rounded-xl hover:bg-slate-700/50 text-slate-300 font-medium flex items-center gap-3 transition";
      navPlantilla.className = "w-full text-left px-4 py-3 rounded-xl hover:bg-slate-700/50 text-slate-300 font-medium flex items-center gap-3 transition";
      navPartidos.className = "w-full text-left px-4 py-3 rounded-xl hover:bg-slate-700/50 text-slate-300 font-medium flex items-center gap-3 transition";

      if (view === 'pizarra') {
        secPizarra.classList.remove('hidden');
        navPizarra.className = "w-full text-left px-4 py-3 rounded-xl bg-slate-700 text-white font-medium flex items-center gap-3 transition";
        headerTitle.innerHTML = '⚽ Pizarra Táctica';
        headerActions.classList.remove('hidden');
      } else if (view === 'plantilla') {
        secPlantilla.classList.remove('hidden');
        navPlantilla.className = "w-full text-left px-4 py-3 rounded-xl bg-slate-700 text-white font-medium flex items-center gap-3 transition";
        headerTitle.innerHTML = '👥 Plantilla del Equipo';
        headerActions.classList.add('hidden');
        renderSquadList();
      } else if (view === 'partidos') {
        secPartidos.classList.remove('hidden');
        navPartidos.className = "w-full text-left px-4 py-3 rounded-xl bg-slate-700 text-white font-medium flex items-center gap-3 transition";
        headerTitle.innerHTML = '📅 Partidos Guardados';
        headerActions.classList.add('hidden');
        renderMatchesList();
      }
      toggleSidebar(false);
    }

    btnHamburger.addEventListener('click', () => toggleSidebar(true));
    btnCloseSidebar.addEventListener('click', () => toggleSidebar(false));
    sidebarOverlay.addEventListener('click', () => toggleSidebar(false));

    navPizarra.addEventListener('click', () => switchView('pizarra'));
    navPlantilla.addEventListener('click', () => switchView('plantilla'));
    navPartidos.addEventListener('click', () => switchView('partidos'));

    // --- LÓGICA DE LA PIZARRA Y FICHAS ---
    function initTokens() {
      const formConfig = formations[currentFormationKey];
      activeTokens = formConfig.map(item => ({
        slot: item.slot,
        role: item.role,
        x: item.x,
        y: item.y,
        playerId: null
      }));
      savePitchState();
    }

    function savePitchState() {
      localStorage.setItem('f11_formation', currentFormationKey);
      localStorage.setItem('f11_kit', currentKit);
      localStorage.setItem('f11_active_tokens', JSON.stringify(activeTokens));
    }

    function renderPitch() {
      document.querySelectorAll('.player-token').forEach(el => el.remove());

      activeTokens.forEach(token => {
        const assignedPlayer = squad.find(p => p.id === token.playerId);
        
        let kitBg = 'bg-blue-900 border-white text-white';
        if (currentKit === 'local') {
          kitBg = token.role === 'POR' ? 'bg-amber-400 text-slate-900 border-white' : 'bg-blue-900 text-white border-white';
        } else {
          kitBg = token.role === 'POR' ? 'bg-cyan-500 text-slate-900 border-white' : 'bg-pink-600 text-white border-white';
        }

        const tokenEl = document.createElement('div');
        tokenEl.className = `player-token absolute rounded-full ${kitBg} font-black flex flex-col items-center justify-center border-2 shadow-xl touch-none cursor-grab active:cursor-grabbing z-20`;
        tokenEl.style.width = '42px';
        tokenEl.style.height = '42px';
        tokenEl.style.left = `${token.x}%`;
        tokenEl.style.top = `${token.y}%`;
        tokenEl.style.transform = 'translate(-50%, -50%)';

        const displayNum = assignedPlayer ? assignedPlayer.num : token.slot;
        const displayName = assignedPlayer ? assignedPlayer.name : token.role;

        tokenEl.innerHTML = `
          <span class="text-xs leading-none">${displayNum}</span>
          <span class="text-[7px] leading-tight opacity-90 truncate max-w-[36px]">${displayName}</span>
        `;

        makeDraggable(tokenEl, token);

        tokenEl.addEventListener('dblclick', () => openAssignPlayerModal(token.slot, token.role));
        
        let tapTimer = null;
        tokenEl.addEventListener('touchend', (e) => {
          if (!tapTimer) {
            tapTimer = setTimeout(() => { tapTimer = null; }, 300);
          } else {
            clearTimeout(tapTimer);
            tapTimer = null;
            openAssignPlayerModal(token.slot, token.role);
          }
        });

        pitch.appendChild(tokenEl);
      });
    }

    function makeDraggable(element, tokenData) {
      let isDragging = false;
      let startX, startY;

      element.addEventListener('pointerdown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        element.setPointerCapture(e.pointerId);
        element.classList.add('scale-125', 'z-30', 'ring-4', 'ring-emerald-400/50');
      });

      element.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const rect = pitch.getBoundingClientRect();
        let x = ((e.clientX - rect.left) / rect.width) * 100;
        let y = ((e.clientY - rect.top) / rect.height) * 100;

        x = Math.max(5, Math.min(95, x));
        y = Math.max(5, Math.min(95, y));

        element.style.left = `${x}%`;
        element.style.top = `${y}%`;
        
        tokenData.x = x;
        tokenData.y = y;
      });

      const stopDrag = (e) => {
        if (!isDragging) return;
        isDragging = false;
        element.releasePointerCapture(e.pointerId);
        element.classList.remove('scale-125', 'z-30', 'ring-4', 'ring-emerald-400/50');
        savePitchState();

        const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
        if (dist < 5) {
          openAssignPlayerModal(tokenData.slot, tokenData.role);
        }
      };

      element.addEventListener('pointerup', stopDrag);
      element.addEventListener('pointercancel', stopDrag);
    }

    // --- MODAL SELECCIONAR JUGADOR ---
    function openAssignPlayerModal(slotId, role) {
      selectedSlotId = slotId;
      const modalList = document.getElementById('modal-player-list');
      document.getElementById('modal-title').innerText = `Asignar Posición ${role} (#${slotId})`;
      modalList.innerHTML = '';

      const clearBtn = document.createElement('button');
      clearBtn.className = "w-full p-2.5 bg-slate-700/50 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold text-left mb-2 flex justify-between items-center border border-slate-600";
      clearBtn.innerHTML = `<span>⚪ Dejar posición vacía</span>`;
      clearBtn.onclick = () => assignPlayerToSlot(null);
      modalList.appendChild(clearBtn);

      sortSquad();
      squad.forEach(player => {
        const isIdeal = player.roles.includes(role);
        const item = document.createElement('button');
        item.className = `w-full p-2.5 rounded-xl text-xs font-semibold text-left flex justify-between items-center border transition ${
          isIdeal ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-200' : 'bg-slate-900 border-slate-700 text-slate-300'
        }`;
        
        item.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="bg-slate-800 border border-slate-600 text-white w-6 h-6 rounded-full flex items-center justify-center font-bold">${player.num}</span>
            <span>${player.name}</span>
          </div>
          <div class="flex items-center gap-1">
            <span class="text-[10px] text-slate-400">${player.roles.join(', ')}</span>
            ${isIdeal ? '<span class="text-emerald-400 text-xs">★</span>' : ''}
          </div>
        `;
        item.onclick = () => assignPlayerToSlot(player.id);
        modalList.appendChild(item);
      });

      modalSelectPlayer.classList.remove('hidden');
    }

    function assignPlayerToSlot(playerId) {
      const token = activeTokens.find(t => t.slot === selectedSlotId);
      if (token) {
        token.playerId = playerId;
        savePitchState();
        renderPitch();
      }
      modalSelectPlayer.classList.add('hidden');
    }

    document.getElementById('btn-close-modal').onclick = () => modalSelectPlayer.classList.add('hidden');

    // --- CONTROLES PIZARRA ---
    selectFormation.value = currentFormationKey;
    selectKit.value = currentKit;

    selectFormation.addEventListener('change', (e) => {
      currentFormationKey = e.target.value;
      initTokens();
      renderPitch();
    });

    selectKit.addEventListener('change', (e) => {
      currentKit = e.target.value;
      savePitchState();
      renderPitch();
    });

    resetBtn.addEventListener('click', () => {
      initTokens();
      renderPitch();
    });

    // --- SECCIÓN PLANTILLA: CREAR / EDITAR / ELIMINAR / ORDENAR ---
    const formAddPlayer = document.getElementById('form-add-player');
    const editPlayerIdInput = document.getElementById('edit-player-id');
    const formTitle = document.getElementById('player-form-title');
    const btnSavePlayer = document.getElementById('btn-save-player');
    const btnCancelEdit = document.getElementById('btn-cancel-edit');

    function renderSquadList() {
      squadList.innerHTML = '';
      sortSquad(); // Ordenamiento numérico garantizado

      if (squad.length === 0) {
        squadList.innerHTML = `<p class="text-slate-500 text-xs text-center py-4">No hay jugadores en la plantilla.</p>`;
        return;
      }

      squad.forEach(player => {
        const item = document.createElement('div');
        item.className = "bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center shadow-sm";
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="bg-emerald-600/30 text-emerald-400 border border-emerald-500/50 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm">${player.num}</span>
            <div>
              <h4 class="font-bold text-sm text-white">${player.name}</h4>
              <div class="flex flex-wrap gap-1 mt-1">
                ${player.roles.map(r => `<span class="bg-slate-900 border border-slate-700 text-[9px] text-slate-300 px-1.5 py-0.5 rounded">${r}</span>`).join('')}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="editPlayer(${player.id})" class="text-slate-400 hover:text-emerald-400 p-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs transition">✏️ Editar</button>
            <button onclick="deletePlayer(${player.id})" class="text-slate-400 hover:text-red-400 p-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs transition">🗑️</button>
          </div>
        `;
        squadList.appendChild(item);
      });
    }

    formAddPlayer.addEventListener('submit', (e) => {
      e.preventDefault();
      const editId = editPlayerIdInput.value;
      const num = parseInt(document.getElementById('player-num').value);
      const name = document.getElementById('player-name').value.trim();
      const selectedRoles = Array.from(document.querySelectorAll('input[name="pos"]:checked')).map(cb => cb.value);

      if (selectedRoles.length === 0) {
        alert("Selecciona al menos una posición para el jugador.");
        return;
      }

      if (editId) {
        // Modo Edición
        const index = squad.findIndex(p => p.id === parseInt(editId));
        if (index !== -1) {
          squad[index] = { id: parseInt(editId), num, name, roles: selectedRoles };
        }
      } else {
        // Modo Creación
        const newPlayer = {
          id: Date.now(),
          num,
          name,
          roles: selectedRoles
        };
        squad.push(newPlayer);
      }

      sortSquad();
      localStorage.setItem('f11_squad', JSON.stringify(squad));
      resetPlayerForm();
      renderSquadList();
      renderPitch();
    });

    window.editPlayer = function(id) {
      const player = squad.find(p => p.id === id);
      if (!player) return;

      editPlayerIdInput.value = player.id;
      document.getElementById('player-num').value = player.num;
      document.getElementById('player-name').value = player.name;

      document.querySelectorAll('input[name="pos"]').forEach(cb => {
        cb.checked = player.roles.includes(cb.value);
      });

      formTitle.innerText = "Editar Jugador";
      btnSavePlayer.innerText = "Actualizar Jugador";
      btnCancelEdit.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function resetPlayerForm() {
      editPlayerIdInput.value = '';
      formAddPlayer.reset();
      formTitle.innerText = "Añadir Nuevo Jugador";
      btnSavePlayer.innerText = "Guardar Jugador";
      btnCancelEdit.classList.add('hidden');
    }

    btnCancelEdit.addEventListener('click', resetPlayerForm);

    window.deletePlayer = function(id) {
      if (confirm("¿Seguro que deseas eliminar este jugador de la plantilla?")) {
        squad = squad.filter(p => p.id !== id);
        sortSquad();
        localStorage.setItem('f11_squad', JSON.stringify(squad));
        renderSquadList();
        renderPitch();
      }
    };

    // --- SECCIÓN GUARDAR / EDITAR / ELIMINAR PARTIDOS ---
    btnSaveLineupModal.addEventListener('click', () => {
      document.getElementById('match-date').value = new Date().toISOString().split('T')[0];
      modalSaveLineup.classList.remove('hidden');
    });

    document.getElementById('btn-close-save-modal').onclick = () => modalSaveLineup.classList.add('hidden');

    document.getElementById('form-save-match').addEventListener('submit', (e) => {
      e.preventDefault();
      const matchName = document.getElementById('match-name').value.trim();
      const matchDate = document.getElementById('match-date').value;
      const matchRival = document.getElementById('match-rival').value.trim();

      const newMatch = {
        id: Date.now(),
        name: matchName,
        date: matchDate,
        rival: matchRival,
        formation: currentFormationKey,
        kit: currentKit,
        tokens: JSON.parse(JSON.stringify(activeTokens))
      };

      savedMatches.unshift(newMatch);
      localStorage.setItem('f11_matches', JSON.stringify(savedMatches));

      modalSaveLineup.classList.add('hidden');
      document.getElementById('form-save-match').reset();
      alert("¡Alineación guardada correctamente en Partidos!");
    });

    function renderMatchesList() {
      matchesList.innerHTML = '';

      if (savedMatches.length === 0) {
        matchesList.innerHTML = `<p class="text-slate-500 text-xs text-center py-6">No tienes partidos ni alineaciones guardadas.</p>`;
        return;
      }

      savedMatches.forEach(match => {
        const card = document.createElement('div');
        card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 shadow-md";
        
        card.innerHTML = `
          <div class="flex justify-between items-start border-b border-slate-700/60 pb-2">
            <div>
              <h4 class="font-bold text-emerald-400 text-sm">${match.name}</h4>
              <p class="text-xs text-slate-300 font-medium mt-0.5">VS: <span class="text-white font-semibold">${match.rival}</span></p>
            </div>
            <span class="bg-slate-900 text-slate-400 text-[10px] px-2 py-0.5 rounded border border-slate-700 font-mono">${match.date}</span>
          </div>

          <div class="flex gap-2 text-[10px]">
            <span class="bg-slate-900 border border-slate-700 text-slate-300 px-2 py-1 rounded">Sistema: <b>${match.formation}</b></span>
            <span class="bg-slate-900 border border-slate-700 text-slate-300 px-2 py-1 rounded">Equipación: <b>${match.kit === 'local' ? 'Local' : 'Visitante'}</b></span>
          </div>

          <div class="flex gap-2 pt-1 border-t border-slate-700/40">
            <button onclick="loadMatchToPitch(${match.id})" class="flex-1 bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-300 border border-emerald-500/50 font-bold py-1.5 rounded-lg text-xs transition flex items-center justify-center gap-1">
              👁️ Cargar en Pizarra
            </button>
            <button onclick="openEditMatchModal(${match.id})" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-xs transition">
              ✏️ Editar Info
            </button>
            <button onclick="deleteMatch(${match.id})" class="bg-slate-700 hover:bg-red-900/60 text-slate-300 hover:text-red-300 px-2.5 py-1.5 rounded-lg text-xs transition">
              🗑️
            </button>
          </div>
        `;
        matchesList.appendChild(card);
      });
    }

    window.loadMatchToPitch = function(matchId) {
      const match = savedMatches.find(m => m.id === matchId);
      if (!match) return;

      currentFormationKey = match.formation;
      currentKit = match.kit;
      activeTokens = JSON.parse(JSON.stringify(match.tokens));

      selectFormation.value = currentFormationKey;
      selectKit.value = currentKit;

      savePitchState();
      renderPitch();
      switchView('pizarra');
    };

    window.openEditMatchModal = function(matchId) {
      const match = savedMatches.find(m => m.id === matchId);
      if (!match) return;

      document.getElementById('edit-match-id').value = match.id;
      document.getElementById('edit-match-name').value = match.name;
      document.getElementById('edit-match-date').value = match.date;
      document.getElementById('edit-match-rival').value = match.rival;

      modalEditMatch.classList.remove('hidden');
    };

    document.getElementById('btn-close-edit-match-modal').onclick = () => modalEditMatch.classList.add('hidden');

    document.getElementById('form-edit-match').addEventListener('submit', (e) => {
      e.preventDefault();
      const matchId = parseInt(document.getElementById('edit-match-id').value);
      const match = savedMatches.find(m => m.id === matchId);

      if (match) {
        match.name = document.getElementById('edit-match-name').value.trim();
        match.date = document.getElementById('edit-match-date').value;
        match.rival = document.getElementById('edit-match-rival').value.trim();

        localStorage.setItem('f11_matches', JSON.stringify(savedMatches));
        renderMatchesList();
        modalEditMatch.classList.add('hidden');
      }
    });

    window.deleteMatch = function(matchId) {
      if (confirm("¿Deseas eliminar este partido guardado?")) {
        savedMatches = savedMatches.filter(m => m.id !== matchId);
        localStorage.setItem('f11_matches', JSON.stringify(savedMatches));
        renderMatchesList();
      }
    };

    // INICIALIZACIÓN
    if (!activeTokens) {
      initTokens();
    }
    renderPitch();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('SW OK'))
        .catch(err => console.error('SW Error:', err));
    }
  </script>
</body>
</html>
